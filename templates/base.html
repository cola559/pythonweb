{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nebula AI | 星云智算</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <nav class="navbar navbar-expand-lg fixed-top navbar-custom">
      <div class="container">
        <a class="navbar-brand text-white" href="{% url 'home' %}">
            <span style="color: var(--primary-color);">✦</span> Nebula AI.
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" style="border-color: rgba(255,255,255,0.1);">
          <span class="navbar-toggler-icon" style="filter: invert(1) grayscale(100%) brightness(200%);"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto gap-3">
            <li class="nav-item"><a class="nav-link" href="{% url 'home' %}">平台首页</a></li>
            <li class="nav-item"><a class="nav-link" href="{% url 'about' %}">关于星云</a></li>
            <li class="nav-item"><a class="nav-link" href="{% url 'products' %}">API与算力</a></li>
            <li class="nav-item"><a class="nav-link" href="{% url 'news_list' %}">新闻中心</a></li>
            <li class="nav-item"><a class="nav-link" href="{% url 'contact' %}">接入咨询</a></li>
            <li class="nav-item"><a class="nav-link" href="{% url 'serviceApp:platform' %}">API与算力</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="main-content">
        {% block content %}{% endblock %}
    </div>

    <footer>
        <div class="container">
            <p class="mb-0">© 2026 Nebula AI Network. 保留所有权利.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
