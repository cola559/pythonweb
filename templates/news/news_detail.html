{% extends 'base.html' %}
{% block content %}
<div class="container mb-5" style="padding-top: 120px; max-width: 800px;">
    <nav aria-label="breadcrumb" class="mb-4">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="{% url 'news_list' %}" class="text-white-50 text-decoration-none">新闻中心</a></li>
            <li class="breadcrumb-item active" style="color: var(--primary-color);">{{ news.category.name }}</li>
        </ol>
    </nav>

    <h1 class="hero-title text-start mb-3" style="font-size: 2.5rem;">{{ news.title }}</h1>
    
    <div class="d-flex gap-3 text-white-50 mb-5 border-bottom border-secondary pb-3">
        <span>发布时间：{{ news.publish_date|date:"Y-m-d H:i" }}</span>
        <span>阅读量：{{ news.views }}</span>
    </div>

    <div class="news-content text-light" style="line-height: 2; font-size: 1.1rem; letter-spacing: 0.5px;">
        {{ news.content|linebreaks }}
    </div>

    <div class="mt-5">
        <a href="{% url 'news_list' %}" class="btn btn-outline-custom">返回列表</a>
    </div>
</div>
{% endblock %}
