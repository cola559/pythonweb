{% extends 'base.html' %}
{% load static %}
{% block content %}

<style>
    /* 专属表单页面背景 */
    .contact-page-bg {
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1;
        background-color: #050810;
        background-image: radial-gradient(circle at 80% 20%, rgba(0, 242, 254, 0.05) 0%, transparent 40%);
    }
    /* 暗黑极客风输入框 */
    .cyber-input {
        background: rgba(15, 23, 42, 0.6) !important;
        border: 1px solid rgba(255, 255, 255, 0.1) !important;
        color: #fff !important;
        border-radius: 8px;
        transition: all 0.3s;
    }
    .cyber-input:focus {
        border-color: #00f2fe !important;
        box-shadow: 0 0 15px rgba(0, 242, 254, 0.2) !important;
    }
    .cyber-input::placeholder { color: rgba(255,255,255,0.3); }
</style>

<div class="contact-page-bg"></div>

<div class="container mb-5" style="padding-top: 120px; max-width: 800px;">
    
    {% if messages %}
        {% for message in messages %}
            <div class="alert {% if message.tags == 'success' %}alert-success{% else %}alert-danger{% endif %} alert-dismissible fade show" role="alert" style="background: rgba(0,242,254,0.1); border: 1px solid #00f2fe; color: #00f2fe;">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close" style="filter: invert(1) grayscale(100%) brightness(200%);"></button>
            </div>
        {% endfor %}
    {% endif %}

    <div class="text-center mb-5">
        <h1 class="hero-title text-white mb-3" style="font-size: 2.5rem;">提交算力接入工单</h1>
        <p class="text-white-50">请描述您的业务场景或上传系统架构图，我们的技术专家将为您量身定制大模型与边缘节点部署方案。</p>
    </div>

    <div class="card p-5 rounded-4 border-secondary" style="background: rgba(15, 23, 42, 0.5); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08);">
        <form method="POST" action="{% url 'contact:contact' %}" enctype="multipart/form-data">
            {% csrf_token %}
            
            <div class="row g-4 mb-4">
                <div class="col-md-6">
                    <label class="form-label text-white-50">企业名称 / 您的姓名 <span class="text-danger">*</span></label>
                    <input type="text" name="name" class="form-control cyber-input py-2" placeholder="Nebula AI Corp." required>
                </div>
                <div class="col-md-6">
                    <label class="form-label text-white-50">联系电话 <span class="text-danger">*</span></label>
                    <input type="text" name="phone" class="form-control cyber-input py-2" placeholder="138xxxx..." required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label text-white-50">电子邮箱 <span class="text-danger">*</span></label>
                <input type="email" name="email" class="form-control cyber-input py-2" placeholder="admin@example.com" required>
            </div>

            <div class="mb-4">
                <label class="form-label text-white-50">算力需求 / 业务描述 <span class="text-danger">*</span></label>
                <textarea name="requirement" class="form-control cyber-input" rows="5" placeholder="请简述您需要部署的模型参数规模、并发量预期或需要解决的业务痛点..." required></textarea>
            </div>

            <div class="mb-4">
                <label class="form-label text-white-50">📎 上传附件 (选填：支持 PDF/Word/图片 格式的架构图或需求文档)</label>
                <input type="file" name="document" class="form-control cyber-input text-white-50" style="background: rgba(255,255,255,0.02) !important;">
            </div>

            <div class="mt-5 text-center">
                <button type="submit" class="btn btn-primary px-5 py-3 fw-bold w-100" style="font-size: 1.1rem; background: linear-gradient(90deg, #00f2fe, #4facfe); border: none; color: #000; box-shadow: 0 0 20px rgba(0,242,254,0.4);">
                    加密提交工单
                </button>
                <p class="text-muted mt-3" style="font-size: 0.8rem;">🔒 您的数据传输已通过 TLS 1.3 协议端到端加密</p>
            </div>
        </form>
    </div>
</div>
{% endblock %}
